name: Build and deploy to GitHub Pages

# The site is the main branch at /diario-fitness/ and, when the "prova" branch
# exists, a preview of it at /diario-fitness/prova/ with its own storage
# (see VITE_KEY_PREFIX), so trying the preview never touches the real data.
# Pushing to "prova" runs preview.yml, which re-runs this workflow on main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:locales
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Check out the preview branch, if there is one
        id: prova
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: prova
          path: .prova
      - name: Build the preview (branch "prova") into dist/prova
        if: steps.prova.outcome == 'success'
        working-directory: .prova
        run: |
          npm ci
          npm run check:locales
          npm test
          VITE_KEY_PREFIX=diario-fitness-prova npm run build
          node -e 'const f="dist/manifest.webmanifest",fs=require("fs"),m=JSON.parse(fs.readFileSync(f));m.name="Diario Fitness · PROVA";m.short_name="Diario PROVA";m.id="./prova";fs.writeFileSync(f,JSON.stringify(m,null,2))'
          cp -r dist "$GITHUB_WORKSPACE/dist/prova"
          ls "$GITHUB_WORKSPACE/dist/prova"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
