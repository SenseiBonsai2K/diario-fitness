<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14110E" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Diario" />
    <title>Diario Fitness</title>
    <script>
      // Apply the saved background and accent before the first paint (no flash).
      try {
        var a = JSON.parse(localStorage.getItem("%VITE_KEY_PREFIX%:appearance") || "{}");
        var r = document.documentElement;
        r.setAttribute("data-bg", "dark");
        r.setAttribute("data-mode", "dark");
        var st = a.style || "fantasy";
        r.setAttribute("data-accent", a.accent || { fantasy: "amber", system: "electric", cyber: "fuchsia" }[st] || "blue");
        r.setAttribute("data-style", st);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
