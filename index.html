<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F3F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Diario" />
    <title>Diario Fitness</title>
    <script>
      // Apply the saved background and accent before the first paint (no flash).
      try {
        var a = JSON.parse(localStorage.getItem("diario-fitness:appearance") || "{}");
        var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var bg = !a.bg || a.bg === "auto" ? (dark ? "dark" : "light") : a.bg;
        var r = document.documentElement;
        r.setAttribute("data-bg", bg);
        r.setAttribute("data-mode", bg === "dark" || bg === "black" ? "dark" : "light");
        r.setAttribute("data-accent", a.accent || "blue");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
